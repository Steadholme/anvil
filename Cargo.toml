[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
description = "Anvil — CI build runner: clone a git repo and run declared shell steps on owned metal, for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/inkwell/loom): Form/State/Path extractors, typed responses.
axum = "0.8"
# Async runtime axum runs on. `process` spawns `git clone` + the pipeline steps as async children
# (with a per-step timeout); `fs` creates/cleans the per-run workspace; `sync` gives the bounded
# Semaphore that caps concurrent runs and the Mutex serializing in-memory writes. The Store trait
# is async: handlers `.await` it directly and PgStore drives sqlx natively, so a worker thread is
# NEVER blocked (no block_in_place, no sync-over-async).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "fs", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the rest
# of the estate).
async-trait = "0.1"
# Deserialize the urlencoded console form bodies; serde_json serializes the audit event.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded error page.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the created/started timestamps (std only — no extra C deps). Same
# crate the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token + the random id suffix. `getrandom` is a tiny
# libc-backed shim (no rand_chacha tree); `hex` (already used across the estate) encodes them.
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time macros,
# so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the same
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
